name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prep-atelier

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prep-atelier

      - name: Run lint
        run: ./gradlew lint

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prep-atelier

      - name: Preuve grep anti-clair (critère C1 — cahier §7.2)
        run: ./tools/audit-clear-text.sh

      - name: Preuve grep permissions SAF (M0-E — cahier §4.1, zéro permission large)
        run: ./tools/audit-saf-permissions.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: warn

  nextcloud-integration:
    name: Intégration Nextcloud (critère C1)
    runs-on: ubuntu-latest
    # Source unique du mot de passe admin CI : job env -> service ET étapes.
    env:
      NEXTCLOUD_URL: http://localhost:8080
      NEXTCLOUD_ADMIN_USER: admin
      # Mot de passe JETABLE : serveur Nextcloud ephemere du runner CI (localhost,
      # detruit a la fin du job). Sans aucun rapport avec une infra reelle.
      NEXTCLOUD_ADMIN_PASSWORD: bocal-ci-admin-2026
    services:
      nextcloud:
        image: nextcloud:stable-apache
        ports:
          - 8080:80
        env:
          NEXTCLOUD_ADMIN_USER: ${{ env.NEXTCLOUD_ADMIN_USER }}
          NEXTCLOUD_ADMIN_PASSWORD: ${{ env.NEXTCLOUD_ADMIN_PASSWORD }}
          NEXTCLOUD_TRUSTED_DOMAINS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prep-atelier

      - name: Installation Nextcloud (sqlite via occ, sans dépendre de l'entrée auto)
        run: |
          for i in $(seq 1 60); do
            CID=$(docker ps -q --filter ancestor=nextcloud:stable-apache | head -1)
            [ -n "$CID" ] && break
            sleep 2
          done
          # occ sous www-data (et pas root) : sinon config.php + base sqlite sont créés
          # root:root 0640 et Apache (www-data) ne peut pas les lire -> status.php ne
          # passe jamais a installed:true (Permission denied dans Config.php#221).
          docker exec -u www-data "$CID" php occ maintenance:install \
            --database sqlite \
            --admin-user "$NEXTCLOUD_ADMIN_USER" \
            --admin-pass "$NEXTCLOUD_ADMIN_PASSWORD" || true

      - name: Attendre la fin de l'installation Nextcloud
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud installé après $((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          echo "Nextcloud jamais prêt — log du conteneur :"
          docker logs "$(docker ps -q --filter ancestor=nextcloud:stable-apache)" | tail -50
          exit 1

      - name: Version Nextcloud utilisée (image stable officielle)
        run: |
          echo "status.php :"
          curl -sf http://localhost:8080/status.php
          curl -sf http://localhost:8080/status.php | grep -o '"version":"[^"]*"' || true

      - name: "Test d'intégration login (C1 : login/v2 200 → token app → Bearer 200 → révocation 200 → 401)"
        uses: ./.github/actions/exiger-test-integration
        with:
          test: NextcloudIntegrationTest

      - name: "Aller-retour bocal (sortie M0 — fixture §4.2 -> WhatsApp/<appareil>/AAAA-MM-JJ/ -> retéléchargement, sha256)"
        uses: ./.github/actions/exiger-test-integration
        env:
          BOCAL_ROUNDTRIP_DIR: ${{ github.workspace }}/out/roundtrip
        with:
          test: BocalRoundTripIntegrationTest

      - name: Preuve sha256SUMS de l'aller-retour (log + résumé d'étape)
        shell: bash
        run: |
          SUMS="$GITHUB_WORKSPACE/out/roundtrip/sha256SUMS"
          test -f "$SUMS" || { echo "sha256SUMS absent — preuve non produite."; exit 1; }
          cat "$SUMS"
          SRC=$(awk '/# SOURCE/,/# SERVEUR/' "$SUMS" | grep -E '^[0-9a-f]{64}' || true)
          SRV=$(awk '/# SERVEUR/,/# VERDICT/' "$SUMS" | grep -E '^[0-9a-f]{64}' || true)
          N=$(echo "$SRC" | grep -c . || true)
          # Le compte attendu (17 sur la fixture) est asserté par le test lui-même.
          if [ "$N" -ge 1 ] && [ "$SRC" = "$SRV" ]; then
            VERDICT="ROUNDTRIP: $N/$N IDENTIQUES"
          else
            VERDICT="ROUNDTRIP: ÉCHEC ($N lignes, comparaison src/srv)"
          fi
          echo "$VERDICT"
          {
            echo "## Aller-retour bocal (sortie M0)"
            echo ""
            echo '```'
            tail -n +2 "$SUMS"
            echo '```'
            echo "**Verdict : \`$VERDICT\`**"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$VERDICT" in *IDENTIQUES*) exit 0;; *) exit 1;; esac

      - name: Upload preuve sha256SUMS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-sha256sums
          path: out/roundtrip/sha256SUMS
          if-no-files-found: error

  reproducible:
    name: Build reproductible (ebauche)
    runs-on: ubuntu-latest
    env:
      # Epoch fixe (2025-01-01T00:00:00Z) pour les DEUX builds : meme entree,
      # deux executions propres. L'ebauche rapporte, elle ne bloque pas (M2-A
      # portera la preuve stricte F-Droid).
      SOURCE_DATE_EPOCH: '1735689600'
      APK: app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prep-atelier
        with:
          gradle-summary-as-pr-comment: never

      - name: Build 1 (SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH, sans cache de build)
        run: |
          rm -rf app/build build
          ./gradlew --stop || true
          ./gradlew --no-build-cache assembleDebug
          sha256sum "$APK"
          sha256sum "$APK" | tee /tmp/sha256-build1.txt

      - name: Clean total entre les deux builds
        run: |
          rm -rf app/build build
          ./gradlew --stop || true

      - name: Build 2 (SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH, sans cache de build)
        run: |
          ./gradlew --no-build-cache assembleDebug
          sha256sum "$APK"
          sha256sum "$APK" | tee /tmp/sha256-build2.txt

      - name: Comparer les sha256 (rapport, jamais bloquant)
        run: |
          SHA1=$(cut -d' ' -f1 /tmp/sha256-build1.txt)
          SHA2=$(cut -d' ' -f1 /tmp/sha256-build2.txt)
          echo "sha256 build 1 : $SHA1"
          echo "sha256 build 2 : $SHA2"
          {
            echo "## Build reproductible (ebauche)"
            echo ""
            echo "| Build | sha256 |"
            echo '|---|---|'
            echo "| 1 | \`$SHA1\` |"
            echo "| 2 | \`$SHA2\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SHA1" = "$SHA2" ]; then
            echo "REPRO: IDENTIQUE"
            echo '**Verdict : `REPRO: IDENTIQUE`**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "REPRO: DIFFERENT"
            echo '**Verdict : `REPRO: DIFFERENT`** (ebauche — a analyser en M2-A)' >> "$GITHUB_STEP_SUMMARY"
            echo '--- diagnostic contenu des APK ---'
            unzip -l "$APK" || true
          fi
        shell: bash
